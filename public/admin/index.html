<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#172033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CoolFix">
<title>Διαχείριση ραντεβού | CoolFix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF1F4;
    --surface: #FFFFFF;
    --ink: #172033;
    --ink-soft: #3C4A57;
    --muted: #5B6875;
    --line: #D3DBE2;
    --panel: #172033;
    --panel-text: #A9BED2;
    --blue: #1877D2;
    --blue-soft: #EAF4FF;
    --green: #1E7A4C;
    --green-soft: #E1F1E8;
    --red: #B8322C;
    --red-soft: #F8E4E2;
    --focus: #7DB3EE;
    --radius: 10px;
    font-family: 'Commissioner', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-size: 16px; line-height: 1.45; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .num, .readout dd, .amt, .totals dd, .when { font-variant-numeric: tabular-nums; }

  /* Σύνδεση */
  .login {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
    padding: 24px; background: var(--panel);
  }
  .login-card {
    width: 100%; max-width: 360px;
    background: var(--surface); border-radius: 14px;
    padding: 28px 24px; display: grid; gap: 10px;
  }
  .login-card h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; }
  .login-card p.lead { margin: 0 0 8px; color: var(--muted); }
  .back { color: var(--muted); font-size: .9rem; text-align: center; margin-top: 6px; }

  /* Πάνω μπάρα με τα σύνολα */
  .top {
    background: var(--panel); color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 20px;
  }
  .bar { max-width: 960px; margin: 0 auto; display: flex; align-items: baseline; gap: 8px; }
  .bar strong { font-size: 1.1rem; }
  .bar span { color: var(--panel-text); }
  .link-light {
    margin-left: auto; background: none; border: 0; padding: 6px;
    color: #CFE0F0; text-decoration: underline; cursor: pointer;
  }
  .readout {
    max-width: 960px; margin: 16px auto 0;
    display: grid; grid-template-columns: repeat(3, 1fr);
  }
  .readout > div { padding: 0 12px; border-left: 1px solid rgba(255,255,255,.18); min-width: 0; }
  .readout > div:first-child { padding-left: 0; border-left: 0; }
  .readout dt { font-size: .82rem; color: var(--panel-text); }
  .readout dd { margin: 0; }
  .readout .num {
    font-size: clamp(1.35rem, 6vw, 2.3rem); font-weight: 600;
    line-height: 1.15; letter-spacing: -.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .readout .sub { font-size: .8rem; color: #CFE0F0; }

  /* Καρτέλες */
  .tabs {
    display: flex; justify-content: center;
    background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  .tabs button {
    flex: 0 1 190px; background: none; border: 0; cursor: pointer;
    padding: 14px 8px; font-weight: 600; color: var(--muted);
    border-bottom: 3px solid transparent;
  }
  .tabs button[aria-current="page"] { color: var(--blue); border-bottom-color: var(--blue); }
  .tabs svg { display: none; }

  @media (max-width: 640px) {
    body { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
    .tabs {
      position: fixed; top: auto; bottom: 0; left: 0; right: 0;
      border-bottom: 0; border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .tabs button {
      flex: 1; padding: 8px 4px 10px; font-size: .8rem;
      border-bottom: 0; border-top: 3px solid transparent;
      display: grid; justify-items: center; gap: 2px;
    }
    .tabs button[aria-current="page"] { border-top-color: var(--blue); }
    .tabs svg { display: block; width: 22px; height: 22px; }
  }

  .view { max-width: 960px; margin: 0 auto; padding: 18px 16px 32px; }

  /* Φόρμα */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .panel h2 { margin: 0; font-size: 1.2rem; }
  form.panel { display: grid; gap: 14px; max-width: 640px; }
  label { display: grid; gap: 5px; font-size: .9rem; font-weight: 500; color: var(--ink-soft); }
  input:not([type="radio"]), select, textarea {
    width: 100%; min-height: 46px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fff; font-size: 16px; color: var(--ink);
  }
  textarea { min-height: 80px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }

  fieldset.seg { border: 0; padding: 0; margin: 0; min-width: 0; }
  .seg legend { font-size: .9rem; font-weight: 500; color: var(--ink-soft); padding: 0; margin-bottom: 5px; }
  .seg-row { display: flex; }
  .seg-row label { display: block; flex: 1; }
  .seg-row input { position: absolute; opacity: 0; pointer-events: none; }
  .seg-row span {
    display: block; text-align: center; cursor: pointer;
    padding: 11px 6px; margin-left: -1px;
    border: 1px solid var(--line); background: #fff;
    font-weight: 500; color: var(--ink-soft); white-space: nowrap;
  }
  .seg-row label:first-child span { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg-row label:last-child span { border-radius: 0 8px 8px 0; }
  .seg-row input:checked + span { background: var(--blue); border-color: var(--blue); color: #fff; position: relative; }
  .seg-row input[value="done"]:checked + span { background: var(--green); border-color: var(--green); }
  .seg-row input[value="cancelled"]:checked + span { background: var(--red); border-color: var(--red); }
  .seg-row input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 1px; position: relative; z-index: 1; }

  .btn {
    min-height: 46px; padding: 10px 18px; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600;
  }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.danger { color: var(--red); border-color: #E6B9B5; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .actions .danger { margin-left: auto; }
  .error { color: var(--red); margin: 0; font-size: .92rem; }
  .error:empty { display: none; }
  .hint {
    margin: -6px 0 0; font-size: .88rem; color: var(--green);
    background: var(--green-soft); padding: 8px 10px; border-radius: 6px;
  }

  /* Λίστα */
  .list-tools { display: grid; gap: 10px; margin-bottom: 12px; }
  .list-total { color: var(--muted); font-size: .9rem; margin: 0 0 8px; }
  .jobs {
    list-style: none; margin: 0 0 16px; padding: 0;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
  }
  .jobs li { display: flex; border-top: 1px solid var(--line); }
  .jobs li:first-child { border-top: 0; }
  .job {
    flex: 1; min-width: 0; display: grid; grid-template-columns: 58px 1fr auto;
    gap: 10px; align-items: center; text-align: left;
    background: none; border: 0; padding: 12px 14px; cursor: pointer;
  }
  .job:hover { background: #F6F8FA; }
  .when { font-size: .82rem; color: var(--muted); line-height: 1.25; }
  .when b { display: block; color: var(--ink); font-size: 1rem; }
  .who { font-weight: 600; min-width: 0; }
  .who small {
    display: block; font-weight: 400; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .amt { text-align: right; font-weight: 600; }
  .st { display: inline-block; margin-top: 3px; font-size: .74rem; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
  .st.scheduled { background: var(--blue-soft); color: var(--blue); }
  .st.done { background: var(--green-soft); color: var(--green); }
  .st.cancelled { background: var(--red-soft); color: var(--red); }
  .call {
    display: grid; place-items: center; width: 54px; flex: none;
    border-left: 1px solid var(--line); color: var(--blue);
  }
  .call svg { width: 22px; height: 22px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); display: block !important; }

  /* Γραφήματα */
  .range-note { color: var(--muted); font-size: .9rem; margin: 10px 0 12px; }
  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 14px; }
  .totals div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .totals dt { font-size: .82rem; color: var(--muted); }
  .totals dd { margin: 2px 0 0; font-size: 1.3rem; font-weight: 600; }
  @media (max-width: 640px) { .totals { grid-template-columns: repeat(2, 1fr); } }
  figure.panel { margin: 0 0 14px; }
  figcaption { font-weight: 600; margin-bottom: 10px; }
  .chart-box { position: relative; height: 290px; }
  .chart-box.sm { height: 240px; }
  .charts-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .charts-2 { grid-template-columns: 1fr; } }
  .fig-empty { color: var(--muted); margin: 0; padding: 40px 0; text-align: center; }

  #toast {
    position: fixed; left: 50%; z-index: 20;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px;
    transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (min-width: 641px) { #toast { bottom: 24px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- ========== ΣΥΝΔΕΣΗ ========== -->
<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <h1>CoolFix</h1>
    <p class="lead">Σύνδεση διαχειριστή</p>
    <label for="password">Κωδικός</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn primary" id="loginBtn">Σύνδεση</button>
    <p class="error" id="loginError" role="alert"></p>
    <a href="/" class="back">Πίσω στη σελίδα</a>
  </form>
</main>

<!-- ========== ΕΦΑΡΜΟΓΗ ========== -->
<div id="app" hidden>
  <header class="top">
    <div class="bar">
      <strong>CoolFix</strong><span>Διαχείριση</span>
      <button type="button" id="logoutBtn" class="link-light">Αποσύνδεση</button>
    </div>
    <dl class="readout" aria-label="Εισπράξεις">
      <div><dt>Σήμερα</dt><dd class="num" id="sumDay">–</dd><dd class="sub" id="sumDayJobs"></dd></div>
      <div><dt>Αυτή την εβδομάδα</dt><dd class="num" id="sumWeek">–</dd><dd class="sub" id="sumWeekJobs"></dd></div>
      <div><dt>Αυτόν τον μήνα</dt><dd class="num" id="sumMonth">–</dd><dd class="sub" id="sumMonthJobs"></dd></div>
    </dl>
  </header>

  <nav class="tabs" aria-label="Ενότητες">
    <button type="button" data-view="form" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Νέο ραντεβού
    </button>
    <button type="button" data-view="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      Ραντεβού
    </button>
    <button type="button" data-view="charts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Γραφήματα
    </button>
  </nav>

  <!-- Νέο / επεξεργασία ραντεβού -->
  <section id="view-form" class="view">
    <form id="jobForm" class="panel" novalidate>
      <h2 id="formTitle">Νέο ραντεβού</h2>

      <div class="grid2">
        <label>Ημερομηνία<input type="date" name="job_date" required></label>
        <label>Ώρα<input type="time" name="job_time"></label>
      </div>

      <label>Όνομα πελάτη<input name="customer_name" autocomplete="off" required></label>

      <div class="grid2">
        <label>Τηλέφωνο<input name="phone" type="tel" inputmode="tel" autocomplete="off"></label>
        <label>Περιοχή<input name="area" list="areaList" autocomplete="off"></label>
      </div>
      <p class="hint" id="phoneHint" hidden></p>
      <datalist id="areaList"></datalist>

      <label>Εργασία
        <select name="service">
          <option>Service / Συντήρηση</option>
          <option>Επισκευή βλάβης</option>
          <option>Εγκατάσταση</option>
          <option>Καθαρισμός</option>
          <option>Διάγνωση</option>
          <option>Κάτι άλλο</option>
        </select>
      </label>

      <div class="grid2">
        <label>Συμφωνημένη τιμή (€)<input name="agreed_price" inputmode="decimal" placeholder="π.χ. 60"></label>
        <label>Εισπράχθηκε (€)<input name="collected" inputmode="decimal" placeholder="όταν γίνει"></label>
      </div>

      <fieldset class="seg">
        <legend>Κατάσταση</legend>
        <div class="seg-row">
          <label><input type="radio" name="status" value="scheduled" checked><span>Κλεισμένο</span></label>
          <label><input type="radio" name="status" value="done"><span>Έγινε</span></label>
          <label><input type="radio" name="status" value="cancelled"><span>Ακυρώθηκε</span></label>
        </div>
      </fieldset>

      <fieldset class="seg">
        <legend>Πληρωμή</legend>
        <div class="seg-row">
          <label><input type="radio" name="payment_method" value="cash" checked><span>Μετρητά</span></label>
          <label><input type="radio" name="payment_method" value="card"><span>Κάρτα</span></label>
          <label><input type="radio" name="payment_method" value="bank"><span>Τράπεζα</span></label>
        </div>
      </fieldset>

      <label>Σημειώσεις<textarea name="notes" rows="3" placeholder="π.χ. 2 μονάδες, 3ος όροφος χωρίς ασανσέρ"></textarea></label>

      <p class="error" id="formError" role="alert"></p>

      <div class="actions">
        <button type="submit" class="btn primary" id="saveBtn">Αποθήκευση ραντεβού</button>
        <button type="button" class="btn" id="cancelEdit" hidden>Ακύρωση</button>
        <button type="button" class="btn danger" id="deleteBtn" hidden>Διαγραφή</button>
      </div>
    </form>
  </section>

  <!-- Λίστα ραντεβού -->
  <section id="view-list" class="view" hidden>
    <div class="list-tools">
      <input type="search" id="search" placeholder="Αναζήτηση: όνομα, τηλέφωνο, περιοχή" aria-label="Αναζήτηση">
      <fieldset class="seg">
        <legend class="sr">Διάστημα</legend>
        <div class="seg-row">
          <label><input type="radio" name="listRange" value="today" checked><span>Σήμερα</span></label>
          <label><input type="radio" name="listRange" value="week"><span>Εβδομάδα</span></label>
          <label><input type="radio" name="listRange" value="month"><span>Μήνας</span></label>
          <label><input type="radio" name="listRange" value="all"><span>Όλα</span></label>
        </div>
      </fieldset>
    </div>
    <p class="list-total" id="listTotal"></p>
    <ul class="jobs" id="jobList"></ul>
    <button type="button" class="btn" id="exportBtn">Εξαγωγή για Excel (CSV)</button>
  </section>

  <!-- Γραφήματα -->
  <section id="view-charts" class="view" hidden>
    <fieldset class="seg">
      <legend>Ανά</legend>
      <div class="seg-row">
        <label><input type="radio" name="chartGroup" value="day" checked><span>Μέρα</span></label>
        <label><input type="radio" name="chartGroup" value="week"><span>Εβδομάδα</span></label>
        <label><input type="radio" name="chartGroup" value="month"><span>Μήνα</span></label>
      </div>
    </fieldset>
    <p class="range-note" id="rangeNote"></p>
    <p class="error" id="chartError" role="alert"></p>

    <dl class="totals">
      <div><dt>Εισπράξεις</dt><dd id="tRevenue">–</dd></div>
      <div><dt>Δουλειές</dt><dd id="tJobs">–</dd></div>
      <div><dt>Μέσος όρος ανά δουλειά</dt><dd id="tAvg">–</dd></div>
      <div><dt>Ακυρώσεις</dt><dd id="tCancelled">–</dd></div>
    </dl>

    <figure class="panel">
      <figcaption>Εισπράξεις και δουλειές</figcaption>
      <div class="chart-box"><canvas id="revChart" aria-label="Γράφημα εισπράξεων"></canvas></div>
    </figure>

    <div class="charts-2">
      <figure class="panel">
        <figcaption>Τρόπος πληρωμής</figcaption>
        <div class="chart-box sm"><canvas id="payChart" aria-label="Γράφημα τρόπου πληρωμής"></canvas></div>
        <p class="fig-empty" hidden>Δεν υπάρχουν εισπράξεις σε αυτό το διάστημα.</p>
      </figure>
      <figure class="panel">
        <figcaption>Περιοχές με τις περισσότερες εισπράξεις</figcaption>
        <div class="chart-box sm"><canvas id="areaChart" aria-label="Γράφημα περιοχών"></canvas></div>
        <p class="fig-empty" hidden>Δεν υπάρχουν εισπράξεις σε αυτό το διάστημα.</p>
      </figure>
    </div>
  </section>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<style>.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
(() => {
  'use strict';

  /* ---------- Βοηθητικά ---------- */
  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));
  const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  const monthEnd = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const fmtDate = (s) => { const [, m, d] = s.split('-'); return `${+d}/${+m}`; };
  const eurFmt = new Intl.NumberFormat('el-GR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const eurFmt2 = new Intl.NumberFormat('el-GR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 });
  const eur = (v) => eurFmt.format(v || 0);
  const eur2 = (v) => eurFmt2.format(v || 0);
  const jobsText = (n) => `${n} ${n === 1 ? 'δουλειά' : 'δουλειές'}`;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const checked = (name) => document.querySelector(`input[name="${name}"]:checked`).value;

  const STATUS = { scheduled: 'Κλεισμένο', done: 'Έγινε', cancelled: 'Ακυρώθηκε' };
  const PAY = { cash: 'Μετρητά', card: 'Κάρτα', bank: 'Τράπεζα' };
  const DEFAULT_AREAS = ['Αθήνα Κέντρο', 'Πειραιάς', 'Περιστέρι', 'Μαρούσι', 'Χαλάνδρι', 'Γλυφάδα',
    'Καλλιθέα', 'Νέα Σμύρνη', 'Αγία Παρασκευή', 'Αιγάλεω', 'Ελληνικό', 'Αργυρούπολη'];

  async function api(path, { method = 'GET', body } = {}) {
    const res = await fetch(path, {
      method,
      credentials: 'same-origin',
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch { /* κενή απάντηση */ }
    if (res.status === 401 && path !== '/api/login') {
      showLogin();
      throw new Error('Χρειάζεται σύνδεση.');
    }
    if (!res.ok) throw new Error(data?.error || `Κάτι πήγε στραβά (κωδικός ${res.status}).`);
    return data;
  }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  /* ---------- Σύνδεση ---------- */
  function showLogin() {
    $('#app').hidden = true;
    $('#login').hidden = false;
    setTimeout(() => $('#password').focus(), 50);
  }

  function showApp() {
    $('#login').hidden = true;
    $('#app').hidden = false;
    resetForm();
    switchView('form');
    refreshSummary();
    loadAreas();
  }

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#loginBtn');
    $('#loginError').textContent = '';
    btn.disabled = true;
    try {
      await api('/api/login', { method: 'POST', body: { password: $('#password').value } });
      $('#password').value = '';
      showApp();
    } catch (err) {
      $('#loginError').textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  $('#logoutBtn').addEventListener('click', async () => {
    try { await api('/api/logout', { method: 'POST' }); } catch { /* αγνόησέ το */ }
    showLogin();
  });

  /* ---------- Καρτέλες ---------- */
  let currentView = 'form';

  function switchView(view) {
    currentView = view;
    for (const v of ['form', 'list', 'charts']) $(`#view-${v}`).hidden = v !== view;
    document.querySelectorAll('.tabs button').forEach((b) => {
      if (b.dataset.view === view) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
    if (view === 'list') loadList();
    if (view === 'charts') loadCharts();
  }

  document.querySelectorAll('.tabs button').forEach((b) => {
    b.addEventListener('click', () => {
      if (b.dataset.view === 'form') resetForm();
      switchView(b.dataset.view);
    });
  });

  /* ---------- Σύνολα πάνω μπάρας ---------- */
  async function refreshSummary() {
    const now = new Date();
    try {
      const s = await api(`/api/summary?today=${ymd(now)}&week=${ymd(mondayOf(now))}&month=${ymd(monthStart(now))}`);
      $('#sumDay').textContent = eur(s.day_rev);
      $('#sumDayJobs').textContent = jobsText(s.day_jobs) + (s.day_open ? `, +${s.day_open} κλεισμένα` : '');
      $('#sumWeek').textContent = eur(s.week_rev);
      $('#sumWeekJobs').textContent = jobsText(s.week_jobs);
      $('#sumMonth').textContent = eur(s.month_rev);
      $('#sumMonthJobs').textContent = jobsText(s.month_jobs);
    } catch { /* η μπάρα απλώς μένει όπως ήταν */ }
  }

  async function loadAreas() {
    let areas = [];
    try { ({ areas } = await api('/api/areas')); } catch { /* κράτα τις προεπιλογές */ }
    const all = [...new Set([...areas, ...DEFAULT_AREAS])];
    $('#areaList').innerHTML = all.map((a) => `<option value="${esc(a)}">`).join('');
  }

  /* ---------- Φόρμα ---------- */
  const form = $('#jobForm');
  const F = form.elements;
  let editingId = null;

  function resetForm() {
    form.reset();
    editingId = null;
    F.job_date.value = ymd(new Date());
    $('#formTitle').textContent = 'Νέο ραντεβού';
    $('#saveBtn').textContent = 'Αποθήκευση ραντεβού';
    $('#cancelEdit').hidden = true;
    $('#deleteBtn').hidden = true;
    $('#formError').textContent = '';
    $('#phoneHint').hidden = true;
  }

  function fillForm(job) {
    resetForm();
    editingId = job.id;
    for (const name of ['job_date', 'job_time', 'customer_name', 'phone', 'area', 'notes']) {
      F[name].value = job[name] ?? '';
    }
    F.agreed_price.value = job.agreed_price ?? '';
    F.collected.value = job.collected ?? '';
    F.status.value = job.status;
    F.payment_method.value = job.payment_method;
    if (job.service) {
      if (![...F.service.options].some((o) => o.value === job.service)) F.service.add(new Option(job.service));
      F.service.value = job.service;
    }
    $('#formTitle').textContent = 'Επεξεργασία ραντεβού';
    $('#saveBtn').textContent = 'Αποθήκευση αλλαγών';
    $('#cancelEdit').hidden = false;
    $('#deleteBtn').hidden = false;
    switchView('form');
  }

  // Όταν πατάει «Έγινε» και το «Εισπράχθηκε» είναι κενό, βάλε τη συμφωνημένη τιμή
  form.addEventListener('change', (e) => {
    if (e.target.name === 'status' && e.target.value === 'done' && !F.collected.value) {
      F.collected.value = F.agreed_price.value;
    }
  });

  // Γνωστός πελάτης: ψάχνει το τηλέφωνο σε παλιά ραντεβού
  F.phone.addEventListener('change', async () => {
    const hint = $('#phoneHint');
    hint.hidden = true;
    const phone = F.phone.value.replace(/\s+/g, '');
    if (editingId || phone.length < 10) return;
    try {
      const { jobs } = await api(`/api/jobs?phone=${encodeURIComponent(phone)}`);
      if (!jobs.length) return;
      const last = jobs[0];
      hint.textContent = `Γνωστός πελάτης: ${last.customer_name}${last.area ? ', ' + last.area : ''}. `
        + `${jobs.length} ${jobs.length === 1 ? 'προηγούμενο ραντεβού' : 'προηγούμενα ραντεβού'}, τελευταίο στις ${fmtDate(last.job_date)}.`;
      hint.hidden = false;
      if (!F.customer_name.value) F.customer_name.value = last.customer_name;
      if (!F.area.value) F.area.value = last.area || '';
    } catch { /* όχι κρίσιμο */ }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('#formError');
    err.textContent = '';
    const data = Object.fromEntries(new FormData(form));
    if (!data.job_date) { err.textContent = 'Βάλε ημερομηνία.'; return; }
    if (!data.customer_name.trim()) { err.textContent = 'Βάλε όνομα πελάτη.'; F.customer_name.focus(); return; }

    const btn = $('#saveBtn');
    btn.disabled = true;
    const wasEditing = editingId;
    try {
      if (wasEditing) await api(`/api/jobs/${wasEditing}`, { method: 'PUT', body: data });
      else await api('/api/jobs', { method: 'POST', body: data });
      toast(wasEditing ? 'Οι αλλαγές αποθηκεύτηκαν' : 'Το ραντεβού αποθηκεύτηκε');
      resetForm();
      refreshSummary();
      loadAreas();
      if (wasEditing) switchView('list');
    } catch (ex) {
      err.textContent = ex.message;
    } finally {
      btn.disabled = false;
    }
  });

  $('#cancelEdit').addEventListener('click', () => { resetForm(); switchView('list'); });

  $('#deleteBtn').addEventListener('click', async () => {
    if (!editingId || !confirm('Να διαγραφεί αυτό το ραντεβού; Δεν αναιρείται.')) return;
    try {
      await api(`/api/jobs/${editingId}`, { method: 'DELETE' });
      toast('Το ραντεβού διαγράφηκε');
      resetForm();
      refreshSummary();
      switchView('list');
    } catch (ex) {
      $('#formError').textContent = ex.message;
    }
  });

  /* ---------- Λίστα ---------- */
  let listData = [];
  let shownRows = [];

  async function loadList() {
    const range = checked('listRange');
    const now = new Date();
    let qs = '';
    if (range === 'today') qs = `?from=${ymd(now)}&to=${ymd(now)}`;
    if (range === 'week') { const m = mondayOf(now); qs = `?from=${ymd(m)}&to=${ymd(addDays(m, 6))}`; }
    if (range === 'month') qs = `?from=${ymd(monthStart(now))}&to=${ymd(monthEnd(now))}`;

    $('#jobList').innerHTML = '<li class="empty">Φόρτωση…</li>';
    try {
      ({ jobs: listData } = await api('/api/jobs' + qs));
      // Σήμερα/εβδομάδα: σαν ατζέντα (από το νωρίτερο). Μήνας/όλα: τα πιο πρόσφατα πρώτα.
      if (range === 'today' || range === 'week') listData.reverse();
      renderList();
    } catch (ex) {
      $('#jobList').innerHTML = `<li class="empty">${esc(ex.message)}</li>`;
    }
  }

  function renderList() {
    const q = norm($('#search').value.trim());
    shownRows = q
      ? listData.filter((j) => norm(`${j.customer_name} ${j.phone} ${j.area} ${j.service} ${j.notes}`).includes(q))
      : listData;

    const revenue = shownRows.filter((j) => j.status === 'done').reduce((s, j) => s + (j.collected || 0), 0);
    $('#listTotal').textContent = shownRows.length
      ? `${shownRows.length} ραντεβού, εισπράξεις ${eur2(revenue)}`
      : '';

    if (!shownRows.length) {
      $('#jobList').innerHTML = `<li class="empty">${q
        ? 'Κανένα ραντεβού δεν ταιριάζει με την αναζήτηση.'
        : 'Δεν υπάρχουν ραντεβού σε αυτό το διάστημα. Πρόσθεσε ένα από το «Νέο ραντεβού».'}</li>`;
      return;
    }

    $('#jobList').innerHTML = shownRows.map((j) => {
      const amount = j.status === 'done' ? j.collected : j.agreed_price;
      const detail = [j.area, j.service].filter(Boolean).join(', ');
      const call = j.phone
        ? `<a class="call" href="tel:${esc(j.phone)}" aria-label="Κλήση ${esc(j.customer_name)}">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
           </a>`
        : '';
      return `<li>
        <button type="button" class="job" data-id="${j.id}">
          <span class="when"><b>${esc(j.job_time || '–')}</b>${fmtDate(j.job_date)}</span>
          <span class="who">${esc(j.customer_name)}<small>${esc(detail || j.phone || '')}</small></span>
          <span class="amt">${amount != null ? eur2(amount) : ''}<br><span class="st ${j.status}">${STATUS[j.status]}</span></span>
        </button>${call}
      </li>`;
    }).join('');
  }

  $('#jobList').addEventListener('click', (e) => {
    const btn = e.target.closest('.job');
    if (!btn) return;
    const job = listData.find((j) => j.id === Number(btn.dataset.id));
    if (job) fillForm(job);
  });

  $('#search').addEventListener('input', renderList);
  document.querySelectorAll('input[name="listRange"]').forEach((r) => r.addEventListener('change', loadList));

  // CSV για Excel (ελληνικό Excel: ερωτηματικό ως διαχωριστικό, κόμμα στα δεκαδικά)
  $('#exportBtn').addEventListener('click', () => {
    if (!shownRows.length) { toast('Δεν υπάρχουν ραντεβού για εξαγωγή'); return; }
    const head = ['Ημερομηνία', 'Ώρα', 'Πελάτης', 'Τηλέφωνο', 'Περιοχή', 'Εργασία',
      'Συμφωνημένη τιμή', 'Εισπράχθηκε', 'Πληρωμή', 'Κατάσταση', 'Σημειώσεις'];
    const money = (v) => (v == null ? '' : String(v).replace('.', ','));
    const cell = (v) => {
      let s = String(v ?? '');
      if (/^[=@]|^[+\-][^\d]/.test(s)) s = "'" + s; // προστασία από τύπους Excel
      return /[";\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const rows = shownRows.map((j) => [
      j.job_date, j.job_time, j.customer_name, j.phone, j.area, j.service,
      money(j.agreed_price), money(j.collected), PAY[j.payment_method], STATUS[j.status], j.notes,
    ]);
    const csv = '\ufeff' + [head, ...rows].map((r) => r.map(cell).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `coolfix-rantevou-${ymd(new Date())}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  /* ---------- Γραφήματα ---------- */
  const charts = {};
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  function periodKeys(group) {
    const now = new Date();
    const keys = [];
    let from;
    if (group === 'day') {
      from = addDays(now, -29);
      for (let i = 0; i < 30; i++) keys.push(ymd(addDays(from, i)));
    } else if (group === 'week') {
      from = addDays(mondayOf(now), -77);
      for (let i = 0; i < 12; i++) keys.push(ymd(addDays(from, i * 7)));
    } else {
      from = new Date(now.getFullYear(), now.getMonth() - 11, 1);
      for (let i = 0; i < 12; i++) {
        const d = new Date(from.getFullYear(), from.getMonth() + i, 1);
        keys.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`);
      }
    }
    return { keys, from: ymd(from), to: ymd(now) };
  }

  function keyLabel(group, k) {
    if (group === 'month') {
      const [y, m] = k.split('-');
      return new Date(+y, +m - 1, 1).toLocaleDateString('el-GR', { month: 'short', year: '2-digit' });
    }
    return fmtDate(k);
  }

  function draw(id, config) {
    charts[id]?.destroy();
    charts[id] = new Chart(document.getElementById(id), config);
  }

  function toggleEmpty(canvasId, isEmpty) {
    const fig = document.getElementById(canvasId).closest('figure');
    fig.querySelector('.chart-box').hidden = isEmpty;
    fig.querySelector('.fig-empty').hidden = !isEmpty;
  }

  async function loadCharts() {
    const errBox = $('#chartError');
    errBox.textContent = '';
    if (!window.Chart) {
      errBox.textContent = 'Τα γραφήματα δεν φόρτωσαν. Έλεγξε τη σύνδεση στο internet και άνοιξε ξανά τη σελίδα.';
      return;
    }
    Chart.defaults.font.family = "'Commissioner', system-ui, sans-serif";
    Chart.defaults.color = css('--muted');

    const group = checked('chartGroup');
    const { keys, from, to } = periodKeys(group);
    $('#rangeNote').textContent = {
      day: 'Τελευταίες 30 μέρες',
      week: 'Τελευταίες 12 εβδομάδες',
      month: 'Τελευταίοι 12 μήνες',
    }[group];

    let s;
    try {
      s = await api(`/api/stats?group=${group}&from=${from}&to=${to}`);
    } catch (ex) {
      errBox.textContent = ex.message;
      return;
    }

    const t = s.totals;
    $('#tRevenue').textContent = eur(t.revenue);
    $('#tJobs').textContent = t.jobs;
    $('#tAvg').textContent = t.jobs ? eur(t.revenue / t.jobs) : '–';
    $('#tCancelled').textContent = t.cancelled;

    const byKey = new Map(s.series.map((r) => [r.period, r]));
    draw('revChart', {
      data: {
        labels: keys.map((k) => keyLabel(group, k)),
        datasets: [
          {
            type: 'bar', label: 'Εισπράξεις', yAxisID: 'y',
            data: keys.map((k) => byKey.get(k)?.revenue || 0),
            backgroundColor: css('--blue'), borderRadius: 3, maxBarThickness: 36,
          },
          {
            type: 'line', label: 'Δουλειές', yAxisID: 'y1',
            data: keys.map((k) => byKey.get(k)?.jobs || 0),
            borderColor: css('--ink-soft'), backgroundColor: css('--ink-soft'),
            borderWidth: 2, pointRadius: 2, tension: 0.3,
          },
        ],
      },
      options: {
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 8 } },
          y: { beginAtZero: true, ticks: { callback: (v) => eur(v) } },
          y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { precision: 0 } },
        },
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12 } },
          tooltip: {
            callbacks: {
              label: (c) => (c.dataset.yAxisID === 'y'
                ? `Εισπράξεις: ${eur2(c.parsed.y)}`
                : `Δουλειές: ${c.parsed.y}`),
            },
          },
        },
      },
    });

    const payColors = { cash: '#1877D2', card: '#2E8B6E', bank: '#C98A1B' };
    const pay = s.byPayment.filter((r) => r.revenue > 0);
    toggleEmpty('payChart', !pay.length);
    if (pay.length) {
      draw('payChart', {
        type: 'doughnut',
        data: {
          labels: pay.map((r) => PAY[r.payment_method]),
          datasets: [{ data: pay.map((r) => r.revenue), backgroundColor: pay.map((r) => payColors[r.payment_method]), borderWidth: 2 }],
        },
        options: {
          maintainAspectRatio: false, cutout: '58%',
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 12 } },
            tooltip: { callbacks: { label: (c) => `${c.label}: ${eur2(c.parsed)}` } },
          },
        },
      });
    }

    const areas = s.byArea;
    toggleEmpty('areaChart', !areas.length);
    if (areas.length) {
      draw('areaChart', {
        type: 'bar',
        data: {
          labels: areas.map((r) => r.area),
          datasets: [{ label: 'Εισπράξεις', data: areas.map((r) => r.revenue), backgroundColor: css('--blue'), borderRadius: 3, maxBarThickness: 22 }],
        },
        options: {
          indexAxis: 'y', maintainAspectRatio: false,
          scales: { x: { beginAtZero: true, ticks: { callback: (v) => eur(v) } }, y: { grid: { display: false } } },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: (c) => `${eur2(c.parsed.x)} από ${areas[c.dataIndex].jobs} ${areas[c.dataIndex].jobs === 1 ? 'δουλειά' : 'δουλειές'}` } },
          },
        },
      });
    }
  }

  document.querySelectorAll('input[name="chartGroup"]').forEach((r) => r.addEventListener('change', loadCharts));

  // Όταν ξαναγυρνάει στην εφαρμογή (π.χ. από άλλη εφαρμογή στο κινητό), ανανέωσε τα σύνολα
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !$('#app').hidden) {
      refreshSummary();
      if (currentView === 'list') loadList();
    }
  });

  /* ---------- Εκκίνηση ---------- */
  (async () => {
    try {
      await api('/api/me');
      showApp();
    } catch {
      showLogin();
    }
  })();
})();
</script>
</body>
</html>
